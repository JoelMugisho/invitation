# À placer sur le serveur, par ex. :
#   /etc/nginx/sites-available/mugi.eraste.tech
# puis :
#   ln -s /etc/nginx/sites-available/mugi.eraste.tech /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# Certificat : certbot --nginx -d mugi.eraste.tech
# (ou le mécanisme TLS déjà utilisé pour eraste.tech)

server {
    listen 80;
    listen [::]:80;
    server_name mugi.eraste.tech;

    # Redirection HTTP -> HTTPS (Certbot peut remplacer ce bloc)
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mugi.eraste.tech;

    # ssl_certificate     /etc/letsencrypt/live/mugi.eraste.tech/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/mugi.eraste.tech/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
